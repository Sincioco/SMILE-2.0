<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 600" role="img" aria-labelledby="t d">
<title id="t">Wall and self collision</title><desc id="d">The round ends when the head leaves the valid grid or shares a coordinate with a body segment.</desc>
<rect x="10" y="10" width="1300" height="580" rx="32" fill="#071321"/>
<text x="660" y="65" text-anchor="middle" fill="#50ed7a" font-family="Segoe UI, Arial" font-size="39" font-weight="900">Two Ways The Round Can End</text>
<g transform="translate(55 115)"><rect width="575" height="405" rx="24" fill="#0f2238" stroke="#f45d79" stroke-width="4"/><text x="287" y="55" text-anchor="middle" fill="#ff8298" font-family="Segoe UI, Arial" font-size="30" font-weight="900">1. Wall Collision</text><rect x="100" y="95" width="375" height="220" fill="#02070d" stroke="#4d7598" stroke-width="4"/><rect x="453" y="170" width="60" height="60" rx="10" fill="#2ed164" stroke="#8cf5aa" stroke-width="4"/><text x="287" y="360" text-anchor="middle" fill="#d8e8f5" font-family="Segoe UI, Arial" font-size="21"><tspan x="287" dy="0">X is less than 0 or at least GridWidth,</tspan><tspan x="287" dy="31">or Y leaves 0 through GridHeight − 1.</tspan></text></g>
<g transform="translate(690 115)"><rect width="575" height="405" rx="24" fill="#0f2238" stroke="#ffd21f" stroke-width="4"/><text x="287" y="55" text-anchor="middle" fill="#ffd21f" font-family="Segoe UI, Arial" font-size="30" font-weight="900">2. Self Collision</text><g fill="#2ed164" stroke="#8cf5aa" stroke-width="3"><rect x="135" y="165" width="58" height="58" rx="9"/><rect x="195" y="165" width="58" height="58" rx="9"/><rect x="255" y="165" width="58" height="58" rx="9"/><rect x="315" y="165" width="58" height="58" rx="9"/><rect x="315" y="225" width="58" height="58" rx="9"/><rect x="255" y="225" width="58" height="58" rx="9" fill="#f45d79" stroke="#ff9aab"/></g><text x="287" y="360" text-anchor="middle" fill="#d8e8f5" font-family="Segoe UI, Arial" font-size="21"><tspan x="287" dy="0">The head has the same X and Y</tspan><tspan x="287" dy="31">as one of the body segments.</tspan></text></g>
</svg>