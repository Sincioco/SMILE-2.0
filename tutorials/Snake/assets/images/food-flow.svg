<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 900" role="img" aria-labelledby="t d">
<title id="t">Safe food placement algorithm</title><desc id="d">Pick a random food square, test every snake segment, retry if occupied, otherwise accept it.</desc>
<defs>
  <marker id="whiteArrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#eaf2fa"/></marker>
  <marker id="greenArrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#55e882"/></marker>
  <marker id="redArrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff6983"/></marker>
</defs>
<rect x="10" y="10" width="1030" height="880" rx="34" fill="#071321"/>
<text x="525" y="65" text-anchor="middle" fill="#50ed7a" font-family="Segoe UI, Arial" font-size="39" font-weight="900">SPAWN FOOD WITHOUT HIDING IT</text>
<rect x="325" y="105" width="400" height="92" rx="20" fill="#2467dc"/>
<text x="525" y="162" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial" font-size="29" font-weight="900">FoodValid = FALSE</text>
<line x1="525" y1="200" x2="525" y2="245" stroke="#eaf2fa" stroke-width="6" marker-end="url(#whiteArrow)"/>
<rect x="250" y="255" width="550" height="132" rx="24" fill="#7436d8"/>
<text x="525" y="308" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial" font-size="27" font-weight="900"><tspan x="525" dy="0">Choose random FoodX and FoodY</tspan><tspan x="525" dy="38" font-size="22" font-weight="500">inside the grid</tspan></text>
<line x1="525" y1="390" x2="525" y2="438" stroke="#eaf2fa" stroke-width="6" marker-end="url(#whiteArrow)"/>
<polygon points="525,450 815,600 525,750 235,600" fill="#b85205" stroke="#ffb31c" stroke-width="5"/>
<text x="525" y="572" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial" font-size="27" font-weight="900"><tspan x="525" dy="0">Does this square touch</tspan><tspan x="525" dy="39">any snake segment?</tspan></text>
<path d="M 235 600 H 110 V 322 H 238" fill="none" stroke="#ff6983" stroke-width="6" stroke-linecap="round" marker-end="url(#redArrow)"/>
<text x="62" y="480" text-anchor="middle" fill="#ff8298" font-family="Segoe UI, Arial" font-size="25" font-weight="900">YES</text>
<text x="62" y="516" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial" font-size="21">try again</text>
<line x1="525" y1="753" x2="525" y2="797" stroke="#55e882" stroke-width="6" marker-end="url(#greenArrow)"/>
<text x="585" y="790" fill="#69f090" font-family="Segoe UI, Arial" font-size="25" font-weight="900">NO</text>
<rect x="300" y="812" width="450" height="62" rx="18" fill="#0d913d"/>
<text x="525" y="852" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial" font-size="27" font-weight="900">Food position accepted!</text>
</svg>
