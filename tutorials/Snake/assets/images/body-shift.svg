<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 590" role="img" aria-labelledby="t d">
<title id="t">Copy the snake body backward</title><desc id="d">The tail copies from the segment before it, moving backward toward the head, before the head receives a new coordinate.</desc>
<defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#ffd21f"/></marker></defs>
<rect x="10" y="10" width="1280" height="570" rx="32" fill="#071321"/>
<text x="650" y="64" text-anchor="middle" fill="#50ed7a" font-family="Segoe UI, Arial" font-size="39" font-weight="900">ONE MOVE: COPY FROM THE TAIL BACKWARD</text>
<text x="84" y="166" fill="#91b5d4" font-family="Segoe UI, Arial" font-size="25" font-weight="900">BEFORE</text>
<g transform="translate(210 112)"><rect width="150" height="112" rx="18" fill="#2368dc" stroke="#bce7cc" stroke-width="3"/><text x="75" y="45" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial" font-size="24" font-weight="900">A</text><text x="75" y="80" text-anchor="middle" fill="#e9f4ff" font-family="Segoe UI, Arial" font-size="18">index 0</text></g><g transform="translate(400 112)"><rect width="150" height="112" rx="18" fill="#13833e" stroke="#bce7cc" stroke-width="3"/><text x="75" y="45" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial" font-size="24" font-weight="900">B</text><text x="75" y="80" text-anchor="middle" fill="#e9f4ff" font-family="Segoe UI, Arial" font-size="18">index 1</text></g><g transform="translate(590 112)"><rect width="150" height="112" rx="18" fill="#13833e" stroke="#bce7cc" stroke-width="3"/><text x="75" y="45" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial" font-size="24" font-weight="900">C</text><text x="75" y="80" text-anchor="middle" fill="#e9f4ff" font-family="Segoe UI, Arial" font-size="18">index 2</text></g><g transform="translate(780 112)"><rect width="150" height="112" rx="18" fill="#13833e" stroke="#bce7cc" stroke-width="3"/><text x="75" y="45" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial" font-size="24" font-weight="900">D</text><text x="75" y="80" text-anchor="middle" fill="#e9f4ff" font-family="Segoe UI, Arial" font-size="18">index 3</text></g><g transform="translate(970 112)"><rect width="150" height="112" rx="18" fill="#13833e" stroke="#bce7cc" stroke-width="3"/><text x="75" y="45" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial" font-size="24" font-weight="900">E</text><text x="75" y="80" text-anchor="middle" fill="#e9f4ff" font-family="Segoe UI, Arial" font-size="18">index 4</text></g>
<g stroke="#ffd21f" stroke-width="5" marker-end="url(#a)">
<line x1="935" y1="252" x2="845" y2="252"/><line x1="745" y1="252" x2="655" y2="252"/><line x1="555" y1="252" x2="465" y2="252"/><line x1="365" y1="252" x2="275" y2="252"/>
</g>
<text x="650" y="298" text-anchor="middle" fill="#ffd21f" font-family="Segoe UI, Arial" font-size="23" font-weight="850">E gets D, D gets C, C gets B, B gets A</text>
<text x="84" y="424" fill="#91b5d4" font-family="Segoe UI, Arial" font-size="25" font-weight="900">AFTER</text>
<g transform="translate(210 370)"><rect width="150" height="112" rx="18" fill="#7b35df" stroke="#bce7cc" stroke-width="3"/><text x="75" y="45" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial" font-size="23" font-weight="900">NEW</text><text x="75" y="80" text-anchor="middle" fill="#e9f4ff" font-family="Segoe UI, Arial" font-size="18">index 0</text></g><g transform="translate(400 370)"><rect width="150" height="112" rx="18" fill="#13833e" stroke="#bce7cc" stroke-width="3"/><text x="75" y="45" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial" font-size="23" font-weight="900">A</text><text x="75" y="80" text-anchor="middle" fill="#e9f4ff" font-family="Segoe UI, Arial" font-size="18">index 1</text></g><g transform="translate(590 370)"><rect width="150" height="112" rx="18" fill="#13833e" stroke="#bce7cc" stroke-width="3"/><text x="75" y="45" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial" font-size="23" font-weight="900">B</text><text x="75" y="80" text-anchor="middle" fill="#e9f4ff" font-family="Segoe UI, Arial" font-size="18">index 2</text></g><g transform="translate(780 370)"><rect width="150" height="112" rx="18" fill="#13833e" stroke="#bce7cc" stroke-width="3"/><text x="75" y="45" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial" font-size="23" font-weight="900">C</text><text x="75" y="80" text-anchor="middle" fill="#e9f4ff" font-family="Segoe UI, Arial" font-size="18">index 3</text></g><g transform="translate(970 370)"><rect width="150" height="112" rx="18" fill="#13833e" stroke="#bce7cc" stroke-width="3"/><text x="75" y="45" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial" font-size="23" font-weight="900">D</text><text x="75" y="80" text-anchor="middle" fill="#e9f4ff" font-family="Segoe UI, Arial" font-size="18">index 4</text></g>
<text x="650" y="535" text-anchor="middle" fill="#b8cee2" font-family="Segoe UI, Arial" font-size="22">Then the head receives its new X or Y coordinate.</text>
</svg>